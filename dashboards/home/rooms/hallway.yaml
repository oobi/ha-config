title: "Hall"
path: hallway
icon: mdi:door
subview: true
back_path: /dashboard-home/home
type: sections
max_columns: 3
sections:
    - type: grid
      cards:
          - type: heading
            heading: "Lights"
            icon: mdi:lightbulb-group
          - type: tile
            entity: light.hallway
            name: All lights
            features_position: bottom
            features:
                - type: light-brightness
            grid_options:
                columns: full
          - type: tile
            entity: light.hall_1
            tap_action:
                action: toggle
            hold_action:
                action: more-info
          - type: tile
            entity: light.hall_3
            tap_action:
                action: toggle
            hold_action:
                action: more-info
          - type: tile
            entity: light.hall_3_2
            tap_action:
                action: toggle
            hold_action:
                action: more-info
    - type: grid
      cards:
          - type: heading
            heading: "Scenes"
            icon: mdi:palette
          - type: custom:mushroom-chips-card
            chips:
                - type: entity
                  entity: scene.hallway_trick_or_treat
                  icon: mdi:palette
                  content_info: name
                  name: "Trick or treat"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.hallway_trick_or_treat}}
