title: "Dexter's Room"
path: dexters-bedroom
icon: mdi:bed
subview: true
back_path: /dashboard-home/home
type: sections
max_columns: 3
sections:
    - type: grid
      cards:
          - type: heading
            heading: "Lights"
            icon: mdi:lightbulb-group
          - type: tile
            entity: light.lokis_bedroom
            name: All lights
            features_position: bottom
            features:
                - type: light-brightness
            grid_options:
                columns: full
          - type: tile
            entity: light.hue_color_downlight_1
            tap_action:
                action: toggle
            hold_action:
                action: more-info
          - type: tile
            entity: light.hue_color_downlight_2
            tap_action:
                action: toggle
            hold_action:
                action: more-info
          - type: tile
            entity: light.hue_color_spot_14
            tap_action:
                action: toggle
            hold_action:
                action: more-info
    - type: grid
      cards:
          - type: heading
            heading: "Scenes"
            icon: mdi:palette
          - type: custom:mushroom-chips-card
            chips:
                - type: entity
                  entity: scene.lokis_bedroom_brighter
                  icon: mdi:palette
                  content_info: name
                  name: "Brighter"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.lokis_bedroom_brighter}}
                - type: entity
                  entity: scene.lokis_bedroom_concentrate
                  icon: mdi:palette
                  content_info: name
                  name: "Concentrate"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.lokis_bedroom_concentrate}}
                - type: entity
                  entity: scene.lokis_bedroom_trick_or_treat
                  icon: mdi:palette
                  content_info: name
                  name: "Trick or treat"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.lokis_bedroom_trick_or_treat}}
    - type: grid
      cards:
          - type: heading
            heading: "Devices"
            icon: mdi:devices
          - type: tile
            entity: input_boolean.bedroom_alarm_dexter
            name: Wake-up alarm in this room
            icon: mdi:alarm
            tap_action:
                action: toggle
            grid_options:
                columns: full
    - type: grid
      cards:
          - type: heading
            heading: "Media"
            icon: mdi:speaker
          - type: custom:mushroom-media-player-card
            entity: media_player.dexters_speaker
            use_media_info: true
            show_volume_level: true
            media_controls:
                - play_pause_on
                - previous
                - next
            volume_controls:
                - volume_set
                - volume_mute
            grid_options:
                columns: full
