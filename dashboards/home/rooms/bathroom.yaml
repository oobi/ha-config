title: "Bathroom"
path: bathroom
icon: mdi:shower
subview: true
back_path: /dashboard-home/home
type: sections
max_columns: 3
sections:
    - type: grid
      cards:
          - type: heading
            heading: "Lights"
            icon: mdi:lightbulb-group
            badges:
                - type: entity
                  entity: sensor.bathroom_motion_sensor_temperature
                  show_state: true
                  show_icon: true
                - type: entity
                  entity: binary_sensor.bathroom_motion_sensor_motion
                  show_state: true
                  show_icon: true
          - type: tile
            entity: light.bathroom
            name: All lights
            features_position: bottom
            features:
                - type: light-brightness
            grid_options:
                columns: full
          - type: tile
            entity: light.bathroom_1
            tap_action:
                action: toggle
            hold_action:
                action: more-info
          - type: tile
            entity: light.bathroom_2
            tap_action:
                action: toggle
            hold_action:
                action: more-info
          - type: tile
            entity: light.bathroom_3
            tap_action:
                action: toggle
            hold_action:
                action: more-info
    - type: grid
      cards:
          - type: heading
            heading: "Scenes"
            icon: mdi:palette
          - type: custom:mushroom-chips-card
            chips:
                - type: entity
                  entity: scene.bathroom_bright
                  icon: mdi:palette
                  content_info: name
                  name: "Bright"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.bathroom_bright}}
                - type: entity
                  entity: scene.bathroom_relax
                  icon: mdi:palette
                  content_info: name
                  name: "Relax"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.bathroom_relax}}
                - type: entity
                  entity: scene.bathroom_read
                  icon: mdi:palette
                  content_info: name
                  name: "Read"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.bathroom_read}}
                - type: entity
                  entity: scene.bathroom_concentrate
                  icon: mdi:palette
                  content_info: name
                  name: "Concentrate"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.bathroom_concentrate}}
                - type: entity
                  entity: scene.bathroom_dimmed
                  icon: mdi:palette
                  content_info: name
                  name: "Dimmed"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.bathroom_dimmed}}
                - type: entity
                  entity: scene.bathroom_nightlight
                  icon: mdi:palette
                  content_info: name
                  name: "Nightlight"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.bathroom_nightlight}}
                - type: entity
                  entity: scene.bathroom_energize
                  icon: mdi:palette
                  content_info: name
                  name: "Energize"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.bathroom_energize}}
                - type: entity
                  entity: scene.bathroom_gym
                  icon: mdi:palette
                  content_info: name
                  name: "Gym"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.bathroom_gym}}
                - type: entity
                  entity: scene.bathroom_soho
                  icon: mdi:palette
                  content_info: name
                  name: "Soho"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.bathroom_soho}}
                - type: entity
                  entity: scene.bathroom_savanna_sunset
                  icon: mdi:palette
                  content_info: name
                  name: "Savanna sunset"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.bathroom_savanna_sunset}}
                - type: entity
                  entity: scene.bathroom_tropical_twilight
                  icon: mdi:palette
                  content_info: name
                  name: "Tropical twilight"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.bathroom_tropical_twilight}}
                - type: entity
                  entity: scene.bathroom_arctic_aurora
                  icon: mdi:palette
                  content_info: name
                  name: "Arctic aurora"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.bathroom_arctic_aurora}}
                - type: entity
                  entity: scene.bathroom_spring_blossom
                  icon: mdi:palette
                  content_info: name
                  name: "Spring blossom"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.bathroom_spring_blossom}}
    - type: grid
      cards:
          - type: heading
            heading: "Devices"
            icon: mdi:devices
          - type: tile
            entity: switch.sonoff_1000ece42c
            tap_action:
                action: toggle
            grid_options:
                columns: full
    - type: grid
      cards:
          - type: heading
            heading: "Media"
            icon: mdi:speaker
          - type: custom:mushroom-media-player-card
            entity: media_player.bathroom_speaker
            use_media_info: true
            show_volume_level: true
            media_controls:
                - play_pause_on
                - previous
                - next
            volume_controls:
                - volume_set
                - volume_mute
            grid_options:
                columns: full
    - type: grid
      cards:
          - type: heading
            heading: "Plants"
            icon: mdi:flower
          - type: tile
            entity: plant.plant_5
