title: "Loki's Room"
path: lokis-bedroom
icon: mdi:bed-outline
subview: true
back_path: /dashboard-home/home
type: sections
max_columns: 3
sections:
    - type: grid
      cards:
          - type: heading
            heading: "Lights"
            icon: mdi:lightbulb-group
          - type: tile
            entity: light.enders_bedroom
            name: All lights
            features_position: bottom
            features:
                - type: light-brightness
            grid_options:
                columns: full
          - type: tile
            entity: light.hue_color_spot_12
            tap_action:
                action: toggle
            hold_action:
                action: more-info
          - type: tile
            entity: light.hue_color_spot_13
            tap_action:
                action: toggle
            hold_action:
                action: more-info
          - type: tile
            entity: light.hue_color_spot_15
            tap_action:
                action: toggle
            hold_action:
                action: more-info
    - type: grid
      cards:
          - type: heading
            heading: "Devices"
            icon: mdi:devices
          - type: tile
            entity: input_boolean.bedroom_alarm_loki
            name: Wake-up alarm in this room
            icon: mdi:alarm
            tap_action:
                action: toggle
            grid_options:
                columns: full
    - type: grid
      cards:
          - type: heading
            heading: "Media"
            icon: mdi:speaker
          - type: custom:mushroom-media-player-card
            entity: media_player.loki_s_bedroom_speaker
            use_media_info: true
            show_volume_level: true
            media_controls:
                - play_pause_on
                - previous
                - next
            volume_controls:
                - volume_set
                - volume_mute
            grid_options:
                columns: full
