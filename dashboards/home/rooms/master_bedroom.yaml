title: "Master Bedroom"
path: master-bedroom
icon: mdi:bed-king
subview: true
back_path: /dashboard-home/home
type: sections
max_columns: 3
sections:
    - type: grid
      cards:
          - type: heading
            heading: "Lights"
            icon: mdi:lightbulb-group
          - type: tile
            entity: light.master_bedroom
            name: All lights
            features_position: bottom
            features:
                - type: light-brightness
            grid_options:
                columns: full
          - type: tile
            entity: light.hue_color_spot_6
            tap_action:
                action: toggle
            hold_action:
                action: more-info
          - type: tile
            entity: light.hue_color_spot_7
            tap_action:
                action: toggle
            hold_action:
                action: more-info
          - type: tile
            entity: light.hue_color_spot_8
            tap_action:
                action: toggle
            hold_action:
                action: more-info
          - type: tile
            entity: light.hue_color_spot_9
            tap_action:
                action: toggle
            hold_action:
                action: more-info
    - type: grid
      cards:
          - type: heading
            heading: "Scenes"
            icon: mdi:palette
          - type: custom:mushroom-chips-card
            chips:
                - type: entity
                  entity: scene.master_bedroom_relax
                  icon: mdi:palette
                  content_info: name
                  name: "Relax"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.master_bedroom_relax}}
                - type: entity
                  entity: scene.master_bedroom_read
                  icon: mdi:palette
                  content_info: name
                  name: "Read"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.master_bedroom_read}}
                - type: entity
                  entity: scene.master_bedroom_reading
                  icon: mdi:palette
                  content_info: name
                  name: "Reading"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.master_bedroom_reading}}
                - type: entity
                  entity: scene.master_bedroom_concentrate
                  icon: mdi:palette
                  content_info: name
                  name: "Concentrate"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.master_bedroom_concentrate}}
                - type: entity
                  entity: scene.master_bedroom_energise
                  icon: mdi:palette
                  content_info: name
                  name: "Energise"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.master_bedroom_energise}}
                - type: entity
                  entity: scene.master_bedroom_nightlight
                  icon: mdi:palette
                  content_info: name
                  name: "Nightlight"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.master_bedroom_nightlight}}
                - type: entity
                  entity: scene.master_bedroom_nebula
                  icon: mdi:palette
                  content_info: name
                  name: "Nebula"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.master_bedroom_nebula}}
                - type: entity
                  entity: scene.master_bedroom_painted_sky
                  icon: mdi:palette
                  content_info: name
                  name: "Painted sky"
                  tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.master_bedroom_painted_sky}}
    - type: grid
      cards:
          - type: heading
            heading: "Devices"
            icon: mdi:devices
          - type: tile
            entity: input_boolean.bedroom_alarm_master_bedroom
            name: Wake-up alarm in this room
            icon: mdi:alarm
            tap_action:
                action: toggle
            grid_options:
                columns: full
    - type: grid
      cards:
          - type: heading
            heading: "Media"
            icon: mdi:speaker
          - type: custom:mushroom-media-player-card
            entity: media_player.master_bedroom_wifi
            use_media_info: true
            show_volume_level: true
            media_controls:
                - play_pause_on
                - previous
                - next
            volume_controls:
                - volume_set
                - volume_mute
            grid_options:
                columns: full
