ac_on:
  alias: AC On
  description: >
      Turns the AC on and arms the temperature monitor. Only presses the
      fingerbot if the AC isn't already assumed running (there's no real
      on/off feedback yet - see input_boolean.ac_assumed_running).
  mode: single
  icon: mdi:air-conditioner
  sequence:
  - if:
    - condition: state
      entity_id: input_boolean.ac_assumed_running
      state: "off"
    then:
    - action: button.press
      target:
        entity_id: button.ac_toggle_fingerbot
  - action: input_boolean.turn_on
    target:
      entity_id:
      - input_boolean.ac_assumed_running
      - input_boolean.ac_monitor_armed

ac_off:
  alias: AC Off
  description: >
      Turns the AC off (pressing the fingerbot only if it's assumed running)
      and disarms the temperature monitor. Assumed running is cleared before
      disarming so ac_temperature_monitor_disarm_kill sees nothing to do.
  mode: single
  icon: mdi:air-conditioner-off
  sequence:
  - if:
    - condition: state
      entity_id: input_boolean.ac_assumed_running
      state: "on"
    then:
    - action: button.press
      target:
        entity_id: button.ac_toggle_fingerbot
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ac_assumed_running
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.ac_monitor_armed

toggle_ac:
  alias: Toggle AC
  description: >
      Voice-friendly AC toggle (exposed to Alexa / Google as a scene). Runs
      AC Off if the monitor is armed (whether or not the AC is currently
      running - the monitor may have already turned it off on reaching the
      comfort range), otherwise AC On.
  mode: single
  icon: mdi:air-conditioner
  sequence:
  - if:
    - condition: state
      entity_id: input_boolean.ac_monitor_armed
      state: "on"
    then:
    - action: script.ac_off
    else:
    - action: script.ac_on
