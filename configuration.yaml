# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
    themes: !include_dir_merge_named themes

automation: !include_dir_merge_list automations/
script: !include_dir_merge_named scripts/
scene: !include scenes.yaml
template: !include_dir_merge_list templates/

# Electricity tariff tracking
utility_meter: !include includes/utility_meters.yaml

counter:
    zerohero_credits:
        name: ZeroHero Daily Credits
        initial: 0
        step: 1
        restore: true

input_number:
    zerohero_window_start_reading:
        name: ZeroHero Window Start Reading
        min: 0
        max: 999999
        step: 0.01
        mode: box
        unit_of_measurement: kWh
    ac_comfort_temp_low:
        name: AC Comfort Temp Low
        min: 10
        max: 30
        step: 0.1
        mode: box
        unit_of_measurement: "°C"
        icon: mdi:thermometer-low
    ac_comfort_temp_high:
        name: AC Comfort Temp High
        min: 10
        max: 30
        step: 0.1
        mode: box
        unit_of_measurement: "°C"
        icon: mdi:thermometer-high
    ac_max_runtime_hours:
        name: AC Max Runtime Hours
        min: 1
        max: 12
        step: 0.5
        mode: box
        unit_of_measurement: h
        icon: mdi:timer-alert-outline

input_boolean:
    ac_monitor_armed:
        name: AC Monitor Armed
        icon: mdi:shield-check
    ac_assumed_running:
        name: AC Assumed Running
        icon: mdi:air-conditioner

input_datetime:
    ac_quiet_hours_start:
        name: AC Quiet Hours Start
        has_date: false
        has_time: true

input_select:
    ac_mode:
        name: AC Mode
        options:
            - cool
            - heat
        icon: mdi:sun-snowflake-variant

#cloudflared tunnel
# deprecated -
# see  Settings > System > Network
# http:
#     use_x_forwarded_for: true
#     trusted_proxies:
#         - 172.30.33.0/24

# Custom Controls
lovelace:
    resources:
        - url: /local/custom_cards/solar_control/solar-control-card.js?v=1.1
          type: module

logger:
    default: warning
    logs:
        custom_components.tuya_ble: debug

# Fox ESS battery
sensor:
    - platform: foxess
      deviceID: 60HD15305ANM071
      deviceSN: 60HD15305ANM071
      apiKey: 670e24e9-8b5f-42fe-b506-eabcec3916ca

    # AC runtime tracking (based on assumed running state - see automations/ac_temperature_monitor.yaml)
    - platform: history_stats
      name: AC Runtime Today
      entity_id: input_boolean.ac_assumed_running
      state: "on"
      type: time
      start: "{{ today_at('00:00') }}"
      end: "{{ now() }}"

    - platform: history_stats
      name: AC Activations Today
      entity_id: input_boolean.ac_assumed_running
      state: "on"
      type: count
      start: "{{ today_at('00:00') }}"
      end: "{{ now() }}"
